version: '3.8'
services:
  mysql:
    image: mysql:8.0
    volumes:
      - mysql_volum_fiapsmart:/var/lib/mysql
    ports:
      - 3306:3306
    environment:
      - MYSQL_DATABASE=fiapsmart
      - MYSQL_USER=fiap
      - MYSQL_PASSWORD=${APP_SECRET:?APP_SECRET must be set}
      - MYSQL_ROOT_PASSWORD=${APP_SECRET:?APP_SECRET must be set}
volumes:
  mysql_volum_fiapsmart:
