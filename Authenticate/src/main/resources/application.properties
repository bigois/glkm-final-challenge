spring.application.name=tech-challenge-5-authenticate-login

spring.datasource.url=jdbc:mysql://localhost:3306/fiapsmart?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=fiap
spring.datasource.password=${APP_SECRET}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8089

api.security.token.secret=${APP_SECRET}
